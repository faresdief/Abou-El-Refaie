const msg=[`*${t("w_o")}* — ${t("brand")}`,"",...lines,"",`${t("total")}: ${sum()} ${cur}`,`${t("w_ty")}: ${dl?t("w_dv"):t("w_pk")}`,`${t("name")}: ${d.name.trim()}`,`${t("phone")}: ${dig(d.phone)}`,...(dl?[`${t("w_ar")}: ${t("areas")[d.area|0]}`,`${t("w_ad")}: ${d.addr.trim()}`]:[]),...(d.note.trim()?[`${t("w_nt")}: ${d.note.trim()}`]:[])].join("\n");
const log=store.get("abu-orders",[]);log.push({at:new Date().toISOString(),total:sum(),text:msg});store.set("abu-orders",log.slice(-20));
sendWA(msg);cart={};draft={};store.set("abu-cart",cart);closeAll();sync();toast(t("sent"),4600)}
if(f.id==="resForm"){const tb=d.kind==="table";
if(!check(f,[["name","v_n",v=>v.length>=2],["phone","v_p",okPhone],["date","v_d",v=>!!v&&new Date(v+"T23:59")>=new Date()],["time","v_t",v=>!!v],["addr","v_a",v=>tb||v.length>=6]],$("#re")))return;
const msg=[`*${tb?t("w_r"):t("w_dl")}* — ${t("brand")}`,"",`${t("name")}: ${d.name.trim()}`,`${t("phone")}: ${dig(d.phone)}`,`${t("date")}: ${d.date}`,`${t("time")}: ${d.time}`,...(tb?[`${t("guests")}: ${d.n}`]:[`${t("w_ad")}: ${d.addr.trim()}`]),...(d.note.trim()?[`${t("w_nt")}: ${d.note.trim()}`]:[])].join("\n");
const log=store.get("abu-res",[]);log.push({at:new Date().toISOString(),text:msg});store.set("abu-res",log.slice(-20));
sendWA(msg);closeAll();toast(t("res_ok"),4600)}}));

/* language + boot */
function applyLang(){const h=document.documentElement;h.lang=L;h.dir=L==="ar"?"rtl":"ltr";h.style.setProperty("--d",L==="ar"?-1:1);document.title=t("brand")+" | "+(L==="ar"?"الزمالك":"Zamalek");
$$("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));$$("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));$$("[data-al]").forEach(e=>e.setAttribute("aria-label",t(e.dataset.al)));
$("#lang").textContent=t("other");$("#snd").textContent=snd?"🔊":"🔇";$("#snd").setAttribute("aria-label",snd?t("on"):t("off"));
$("#n1").textContent=fmt(MENU.length);$("#n2").textContent=fmt(4);$("#yr").textContent=new Date().getFullYear();
$$("[data-logo]").forEach(i=>{i.src=LOGO;i.alt=i.classList.contains("bg")?"":t("brand")});$$("[data-hero]").forEach(i=>{i.src=HERO;i.alt=L==="ar"?"ساندوتش شاورما سوري على طبق خشبي":"Syrian shawarma wrap on a wooden plate"});
$("#map").href="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent("شاورما أبو الرفاعي ٢ شارع طه حسين الزمالك");
if($("#md").classList.contains("on"))resForm();renderStatus();sync()}
/* live Cairo status: open 12:00 to 02:00 */
const cairoHour=()=>parseInt(new Intl.DateTimeFormat("en-US",{timeZone:"Africa/Cairo",hour:"numeric",hour12:false}).format(new Date()),10)%24;
function renderStatus(){const h=cairoHour(),o=h>=12||h<2;$$("[data-status]").forEach(e=>{e.dataset.open=o;e.querySelector(".sl").textContent=t(o?"so_l":"sc_l");e.querySelector(".ss").textContent=t(o?"so_s":"sc_s")})}
setInterval(renderStatus,6e4);
/* PWA install */
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
let dip=null;
const syncInstall=()=>$$("[data-install]").forEach(b=>b.hidden=standalone());
addEventListener("beforeinstallprompt",e=>{e.preventDefault();dip=e});
addEventListener("appinstalled",()=>{dip=null;syncInstall();toast(t("installed"))});
async function install(){if(dip){const p=dip;dip=null;try{await p.prompt();await p.userChoice}catch(e){}return}
$("#iosA").hidden=$("#iosN").hidden=!isIOS;$("#iosB").hidden=isIOS;openLayer("ios")}
function icon(n,url){return new Promise(res=>{const im=new Image();im.onload=()=>{try{const c=document.createElement("canvas");c.width=c.height=n;const x=c.getContext("2d");x.fillStyle="#050507";x.fillRect(0,0,n,n);const s=n*.78;x.drawImage(im,(n-s)/2,(n-s)/2,s,s);if(url)return res(c.toDataURL("image/png"));c.toBlob(b=>res(b?URL.createObjectURL(b):LOGO),"image/png")}catch(e){res(LOGO)}};im.onerror=()=>res(LOGO);im.src=LOGO})}
async function setupPWA(){try{
const ap=document.createElement("link");ap.rel="apple-touch-icon";ap.href=await icon(180,true);document.head.append(ap);
const fv=document.createElement("link");fv.rel="icon";fv.href=LOGO;document.head.append(fv);
if(!/^https?:$/.test(location.protocol))return;
const [i1,i2]=await Promise.all([icon(192),icon(512)]),page=location.origin+location.pathname,scope=new URL("./",location.href).href;
const m={name:"شاورما أبو الرفاعي",short_name:"أبو الرفاعي",description:"اطلب شاورما أبو الرفاعي من الزمالك",lang:"ar",dir:"rtl",start_url:page,scope,display:"standalone",background_color:"#050507",theme_color:"#7F1D1D",icons:[{src:i1,sizes:"192x192",type:"image/png",purpose:"any maskable"},{src:i2,sizes:"512x512",type:"image/png",purpose:"any maskable"}]};
const ml=document.createElement("link");ml.rel="manifest";ml.href=URL.createObjectURL(new Blob([JSON.stringify(m)],{type:"application/manifest+json"}));document.head.append(ml);
if("serviceWorker"in navigator)await navigator.serviceWorker.register("sw.js")}catch(e){console.warn("PWA setup:",e)}}
syncInstall();applyLang();setupPWA();
</script>
